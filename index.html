<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f2">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <meta name="application-name" content="Сови">
  <meta name="apple-mobile-web-app-title" content="Сови">
  <meta property="og:site_name" content="Сови">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="yandex-tableau-widget" href="/tableau.json">
  <title>Сови — играем с числами</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      background: #faf8f2;
      color: #174b41;
      font: 1rem/1.55 system-ui, sans-serif;
    }

    main {
      width: min(100%, 38rem);
      display: grid;
      justify-items: center;
      padding: clamp(1.5rem, 6vw, 3rem) clamp(1rem, 5vw, 2.5rem);
      border: 1px solid #dce5e2;
      border-radius: clamp(1.25rem, 4vw, 2rem);
      background: #fff;
      text-align: center;
    }

    .owl {
      display: block;
      width: clamp(7rem, 29vw, 10rem);
      max-width: 100%;
      height: auto;
      margin-bottom: .75rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      line-height: 1.15;
      text-wrap: balance;
    }

    p {
      max-width: 30rem;
      margin: .875rem 0 0;
      color: #476a62;
      font-size: clamp(1rem, 2.5vw, 1.125rem);
      text-wrap: balance;
    }

    nav {
      display: grid;
      gap: .625rem;
      width: min(100%, 24rem);
      margin-top: 1.5rem;
    }

    nav a {
      display: grid;
      grid-template-columns: 1.5rem minmax(0, 1fr) 1.5rem;
      align-items: center;
      gap: .5rem;
      min-height: 3.25rem;
      padding: .75rem 1rem;
      border: 1px solid #a4bdb4;
      border-radius: 999px;
      color: #256b61;
      font: 600 .875rem/1.25rem system-ui, sans-serif;
      text-decoration: none;
      overflow-wrap: anywhere;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 120ms ease, transform 120ms ease;
    }

    .action-icon { width: 1.5rem; height: 1.5rem; }

    nav a:hover { background: #eff6f2; }

    nav .primary {
      border-color: #256b61;
      background: #256b61;
      color: #fff;
    }

    nav .primary:hover { background: #2f756b; }

    nav a:active {
      transform: scale(.96);
      background: #e5eeeb;
    }

    nav .primary:active { background: #3f7d74; }

    @media (prefers-reduced-motion: reduce) {
      nav a { transition: none; }
      nav a:active { transform: none; }
    }

    nav a:focus-visible {
      outline: 2px solid #256b61;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <img class="owl" src="sovi-owl.webp" width="540" height="540" alt="" fetchpriority="high">
    <h1>Сови — играем с числами</h1>
    <p>Игра для детей, которые учатся считать, складывать и вычитать.</p>
    <nav aria-label="Скачать, поддержка и документы">
      <a class="primary" href="https://www.rustore.ru/catalog/app/ru.scitayka.app">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M11,3H13V12L16.5,8.5L18,10L12,16L6,10L7.5,8.5L11,12ZM4,18H20V21H4Z"/></svg>
        <span>Скачать в RuStore</span>
      </a>
      <a href="https://vk.ru/sovi_game">
        <svg class="action-icon" viewBox="0 0 56 56" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6 27.12c0-9.956 0-14.934 3.093-18.027C12.186 6 17.163 6 27.12 6h1.76c9.956 0 14.934 0 18.027 3.093C50 12.186 50 17.163 50 27.12v1.76c0 9.956 0 14.934-3.093 18.027C43.814 50 38.837 50 28.88 50h-1.76c-9.956 0-14.934 0-18.027-3.093C6 43.814 6 38.837 6 28.88v-1.76Z"/><path fill="#fff" d="M29.412 37.699c-10.029 0-15.749-6.875-15.987-18.315h5.023c.165 8.396 3.869 11.953 6.802 12.686V19.384h4.73v7.241c2.897-.311 5.94-3.611 6.966-7.241h4.73c-.788 4.473-4.088 7.773-6.434 9.13 2.346 1.1 6.105 3.978 7.535 9.185H37.57c-1.118-3.484-3.905-6.179-7.59-6.545v6.545h-.568Z"/></svg>
        <span>Сообщество и поддержка ВКонтакте</span>
      </a>
      <a href="https://vk.ru/@sovi_game-privacy-policy">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6m-6 4h6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Политика конфиденциальности</span>
      </a>
    </nav>
  </main>
</body>
</html>
